<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Nogoro Angin — Interactive Flower Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#17121a;font-family:"DM Sans",sans-serif}
body{display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,902px);aspect-ratio:902/512;overflow:hidden;background:#eee5d3;color:#332522;box-shadow:0 24px 80px #0008;isolation:isolate}
.paper-texture,.vignette{position:absolute;inset:0;pointer-events:none;z-index:30}
.paper-texture{background:radial-gradient(#fff3 1px,transparent 1px);background-size:5px 5px;mix-blend-mode:multiply;opacity:.25}
.vignette{background:radial-gradient(circle,transparent 55%,#5e3b3033 100%)}
.opening{position:absolute;inset:0;background:#eee4cf;display:grid;place-items:center;z-index:10;transition:opacity .65s ease,transform .9s ease}
.opening.is-hidden{opacity:0;transform:scale(1.08);pointer-events:none}
.envelope-button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;outline:none}
.envelope{width:130px;filter:drop-shadow(0 15px 15px #765f4540);animation:float 3s ease-in-out infinite;transition:transform .25s ease,filter .25s ease}
.envelope-button:hover .envelope,.envelope-button:focus-visible .envelope{transform:translateY(-5px) scale(1.04);filter:drop-shadow(0 20px 20px #765f4560)}
.tap{font-family:"Cormorant Garamond",serif;color:#ad7c76;font-size:13px;margin-top:12px;font-style:italic}
.hint{position:absolute;bottom:26px;margin:0;color:#a98d79;font:11px "Cormorant Garamond",serif;letter-spacing:1px}
.flower-scene{position:absolute;inset:0;background:#eee4cf;z-index:5;overflow:hidden;opacity:0;pointer-events:none}
.flower-scene.active{opacity:1;pointer-events:auto}
.flower-bloom,.flower-full{position:absolute;background-image:url('assets/floral.jpg');background-size:902px 512px;background-position:center;background-repeat:no-repeat;will-change:transform,opacity}
.flower-bloom{left:50%;top:57%;width:170px;height:150px;transform:translate(-50%,-50%) scale(.05);opacity:0;clip-path:polygon(50% 0,72% 13%,93% 32%,84% 58%,100% 78%,73% 91%,52% 100%,31% 91%,4% 78%,16% 55%,5% 31%,29% 13%);filter:saturate(.95)}
.flower-bloom.bloom-a{background-position:42% 49%}.flower-bloom.bloom-b{background-position:56% 47%}.flower-bloom.bloom-c{background-position:48% 55%}.flower-bloom.bloom-d{background-position:62% 54%}.flower-bloom.bloom-e{background-position:35% 54%}
.flower-scene.active .flower-bloom{animation:bloomOut 2.25s cubic-bezier(.17,.84,.28,1) forwards}
.flower-scene.active .bloom-a{animation-delay:.05s}.flower-scene.active .bloom-b{animation-delay:.25s}.flower-scene.active .bloom-c{animation-delay:.45s}.flower-scene.active .bloom-d{animation-delay:.65s}.flower-scene.active .bloom-e{animation-delay:.85s}
.flower-full{inset:0;width:100%;height:100%;background-size:cover;transform:scale(.18);opacity:0;clip-path:circle(7% at 50% 58%);z-index:1}
.flower-scene.full .flower-full{animation:fillFlowers 2.2s 1.15s cubic-bezier(.2,.8,.2,1) forwards}
.petal{position:absolute;left:50%;top:55%;width:18px;height:26px;background:#f5b9cf;border-radius:80% 20% 80% 20%;opacity:0;z-index:3;filter:blur(.1px);box-shadow:0 2px 5px #7b3d5230}
.flower-scene.active .petal{animation:petalFly 1.7s ease-out forwards}
.petal-1{--dx:-190px;--dy:-120px;--r:-35deg}.petal-2{--dx:190px;--dy:-95px;--r:55deg}.petal-3{--dx:-150px;--dy:80px;--r:25deg}.petal-4{--dx:150px;--dy:105px;--r:-50deg}.petal-5{--dx:-250px;--dy:-15px;--r:-70deg}.petal-6{--dx:240px;--dy:25px;--r:70deg}
.flower-copy{position:absolute;bottom:25px;left:50%;transform:translateX(-50%) translateY(10px);background:#fff0e6e8;padding:8px 18px;border-radius:20px;font:10px "DM Sans";box-shadow:0 4px 12px #5a1e2b22;opacity:0;z-index:5}
.flower-scene.full .flower-copy{animation:copyIn .8s 2.9s ease forwards}
.back-button{position:absolute;right:18px;bottom:18px;border:0;border-radius:20px;padding:8px 12px;background:#6b214a;color:#fff;font-size:10px;cursor:pointer;z-index:6;opacity:0;transform:translateY(8px)}
.flower-scene.full .back-button{animation:copyIn .6s 3.1s ease forwards}
.letter-scene{position:absolute;inset:0;background:#d9c7ae;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:7;transform:scale(1.04);transition:opacity .8s ease,transform 1s ease}
.letter-scene.active{opacity:1;pointer-events:auto;transform:scale(1)}
.letter-card{position:relative;width:50%;height:94%;background:linear-gradient(90deg,#fff8e8,#f7efd9);padding:24px 30px;box-shadow:0 8px 30px #5e463233;overflow:hidden}
.letter-card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 24px,#b8a78718 25px);pointer-events:none}
.from{font-size:8px;letter-spacing:1px;position:relative}.letter-card h1{font:600 33px "Cormorant Garamond",serif;margin:2px 0 10px;position:relative}
.cassette{display:block;width:58%;margin:0 auto 8px;filter:drop-shadow(0 9px 8px #3e342555);position:relative}
.letter-bottom{display:grid;grid-template-columns:1fr .75fr;gap:18px;position:relative}.track-list{font-size:8px}.track-list>div{display:grid;grid-template-columns:28px 1.1fr 1fr 24px;align-items:center;padding:7px 0;border-top:1px solid #a3917228}.track-list small{font-size:7px}.track-list b{font-size:9px}.track-list span{font-size:7px;color:#695e52}.track-list i{font-style:normal;text-align:center;background:#fff;border-radius:50%;padding:5px;cursor:pointer}.track-list p{margin-top:8px;color:#716658}
.liner{background:#f2dfaa;padding:12px;font-family:"Cormorant Garamond",serif;font-size:11px;box-shadow:0 2px 8px #6b5a3422}.liner small{font:7px "DM Sans";letter-spacing:1px}.liner h3{margin:5px 0;font-size:17px}.liner p{line-height:1.35;margin:4px 0 8px}.liner strong{font-size:10px}
.letter-audio{position:absolute;right:22px;bottom:18px;border:0;border-radius:18px;padding:8px 12px;background:#174d35;color:#fff;font-size:9px;cursor:pointer}
.controls{position:absolute;z-index:50;bottom:12px;left:14px;right:14px;display:flex;align-items:center;gap:10px;opacity:0;transition:.3s}.stage:hover .controls{opacity:1}.controls button{border:0;border-radius:50%;width:34px;height:34px;background:#2e1830;color:#fff;cursor:pointer}.controls input[type=range]{flex:1}.upload{font-size:10px;background:#fffdf6dd;padding:7px 9px;border-radius:15px;cursor:pointer;white-space:nowrap}.reset{font-size:15px}
@keyframes float{50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes bloomOut{0%{opacity:0;transform:translate(-50%,-50%) scale(.05)}45%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fillFlowers{0%{opacity:0;transform:scale(.18);clip-path:circle(7% at 50% 58%)}55%{opacity:1}100%{opacity:1;transform:scale(1.05);clip-path:circle(90% at 50% 55%)}}
@keyframes petalFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r))}}
@keyframes copyIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:650px){.letter-card{width:74%;padding:18px}.letter-card h1{font-size:25px}.liner{font-size:8px}.controls{opacity:1}.upload{font-size:8px}.flower-bloom{width:145px;height:130px}.flower-full{background-position:center}}
</style>
</head>

          <div class="track-list">
            <div><small>01</small><b>Nogoro Angin</b><span>La Tasya &amp; Nayla Fardila</span><i id="miniPlay">▶</i></div>
            <p>Playing: <em>Nogoro Angin</em></p>
          </div>
          <div class="liner">
            <small>LINER NOTE</small>
            <h3>Hey you,</h3>
            <p>A little flower, a little music — tekan play dan biar semuanya bermula.</p>
            <strong>Press play.</strong>

    <div class="controls" id="controls">
      <button id="playBtn" aria-label="Play">▶</button>
      <input id="progress" type="range" min="0" max="100" value="0" step="0.01" aria-label="Timeline" />
      <label class="upload">♪ <input id="audioFile" type="file" accept="audio/*" hidden /> Audio</label>
      <button class="reset" id="resetBtn" aria-label="Reset">↺</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </main>
  <script>const stage = document.getElementById('stage');
const opening = document.getElementById('opening');
const envelopeButton = document.getElementById('envelopeButton');
const flowerScene = document.getElementById('flowerScene');
const letterScene = document.getElementById('letterScene');
const backButton = document.getElementById('backButton');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const progress = document.getElementById('progress');
const audio = document.getElementById('audio');
const audioFile = document.getElementById('audioFile');
const letterAudio = document.getElementById('letterAudio');
const miniPlay = document.getElementById('miniPlay');

let flowerTimer = null;
let audioUrl = null;

function openEnvelope(){
  clearTimeout(flowerTimer);
  letterScene.classList.remove('active');
  flowerScene.classList.remove('full');
  flowerScene.classList.add('active');
  flowerScene.setAttribute('aria-hidden','false');
  opening.classList.add('is-hidden');
  // Give the bouquet a moment to grow, then let it fill the screen like the reference.
  flowerTimer = setTimeout(() => flowerScene.classList.add('full'), 900);
}

function resetExperience(){
  clearTimeout(flowerTimer);
  audio.pause();
  audio.currentTime = 0;
  progress.value = 0;
  playBtn.textContent = '▶';
  letterScene.classList.remove('active');
  flowerScene.classList.remove('active','full');
  flowerScene.setAttribute('aria-hidden','true');
  opening.classList.remove('is-hidden');
}

function showLetter(){
  flowerScene.classList.remove('active','full');
  flowerScene.setAttribute('aria-hidden','true');
  letterScene.classList.add('active');
  letterScene.setAttribute('aria-hidden','false');
}

envelopeButton.addEventListener('click', openEnvelope);
backButton.addEventListener('click', resetExperience);

// After the full floral reveal, clicking the flowers opens the interactive letter/player.
flowerScene.addEventListener('click', (e) => {
  if(e.target.closest('.back-button')) return;
  if(flowerScene.classList.contains('full')) showLetter();
});

function toggleAudio(){
  if(!audio.src){
    audioFile.click();
    return;
  }
  if(audio.paused){
    audio.play().then(()=>playBtn.textContent='Ⅱ').catch(()=>{});
  }else{
    audio.pause();
    playBtn.textContent='▶';
  }
}

playBtn.addEventListener('click', toggleAudio);
miniPlay.addEventListener('click', toggleAudio);
letterAudio.addEventListener('click', () => audioFile.click());

progress.addEventListener('input', () => {
  if(audio.duration) audio.currentTime = (Number(progress.value)/100) * audio.duration;
});

audio.addEventListener('timeupdate', () => {
  if(audio.duration) progress.value = (audio.currentTime/audio.duration)*100;
});

audio.addEventListener('play', () => playBtn.textContent='Ⅱ');
audio.addEventListener('pause', () => playBtn.textContent='▶');
audio.addEventListener('ended', () => {playBtn.textContent='▶'; progress.value=0;});

audioFile.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if(!file) return;
  if(audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = URL.createObjectURL(file);
  audio.src = audioUrl;
  audio.load();
  audio.play().then(()=>playBtn.textContent='Ⅱ').catch(()=>{});
});

// Optional: if the user puts assets/nogoro-angin.mp3 in the project, use it automatically.
audio.src = 'assets/nogoro-angin.mp3';
audio.addEventListener('error', () => {
  // Missing audio is okay; choose the MP3 with the Audio button.
}, {once:true});

resetBtn.addEventListener('click', resetExperience);

// Keyboard accessibility.
window.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !opening.classList.contains('is-hidden')) openEnvelope();
  if(e.key === 'Escape') resetExperience();
  if(e.code === 'Space' && !e.target.matches('input,button')){ e.preventDefault(); toggleAudio(); }
});
</script>
</body>
